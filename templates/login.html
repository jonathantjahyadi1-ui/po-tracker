{% extends 'base.html' %}
{% block content %}
<div class="login-shell">
  <a class="brand" href="/">severli<span>PO TRACKER</span></a>
  <section class="login-panel">
    <h1>Masuk</h1>
    <form method="post" data-submit-form>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
      <div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}{{ field.errors }}</div>
      {% endfor %}
      <button class="button primary" type="submit">Masuk</button>
    </form>
  </section>
</div>
{% endblock %}
