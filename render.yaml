services:
  - type: web
    name: rantai-po
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: bash build.sh
    preDeployCommand: python manage.py prepare_database && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: po-evidence
      - key: BUSINESS_RULES_CONFIRMED
        value: "true"
